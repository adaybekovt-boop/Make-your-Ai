name: Apply audited economy source migration
on:
  push:
    branches: [fix/economy-220-daily-boundaries]
    paths:
      - '.github/tune-economy-balance.py'
      - '.github/workflows/apply-economy-once.yml'
permissions:
  contents: write
jobs:
  apply-and-validate:
    if: github.ref == 'refs/heads/fix/economy-220-daily-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply measured balance tuning
        run: |
          if ! grep -q 'export const BALANCE_VERSION = 2' src/systems/config.ts; then
            python3 .github/tune-economy-balance.py
            git add src
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'balance: calibrate board and acquisition gates against measured progression'
            git push origin HEAD:fix/economy-220-daily-boundaries
          fi
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)"
      - name: Install locked dependencies
        run: npm ci
      - name: Full unit test suite
        run: npm test
      - name: Typecheck
        if: success() || failure()
        run: npm run typecheck
      - name: Production build
        if: success() || failure()
        run: npm run build
      - name: Audit contract lifecycle references
        if: always()
        run: |
          grep -RnE 'contracts\.active|active: null|fulfilled:' src/systems src/store || true
