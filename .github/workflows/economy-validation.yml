name: Economy validation

on:
  push:
    branches: [fix/economy-220-daily-boundaries]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Full unit test suite
        run: npm test
      - name: Measure primary 1x pacing (not release approval)
        run: node scripts/check-balance-evidence.mjs
      - name: Typecheck
        if: success() || failure()
        run: npm run typecheck
      - name: Production build
        if: success() || failure()
        run: npm run build
      - name: Install browser test tooling without modifying the application lockfile
        if: success()
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Browser procurement and revenue smoke
        if: success()
        run: |
          mkdir -p artifacts/economy-validation
          npm run dev > artifacts/economy-validation/vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/economy-browser-smoke.mjs
      - name: Acceptance gate - office and taxes remain blocked
        if: success()
        run: node scripts/check-balance-evidence.mjs --enforce
      - name: Record tested revision
        if: always()
        run: |
          mkdir -p artifacts/economy-validation
          git rev-parse HEAD > artifacts/economy-validation/source-commit.txt
      - name: Upload evidence for this exact revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economy-validation-${{ github.sha }}
          path: artifacts/economy-validation/
          if-no-files-found: warn
          retention-days: 14
